apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: invoiceiq
  labels: { app: invoiceiq, component: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: invoiceiq, component: frontend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: invoiceiq, component: frontend }
    spec:
      securityContext:
        # Match the pinned NGINX image's existing unprivileged account.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: ghcr.io/OWNER/REPO/frontend:VERSION
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 20
          resources:
            requests: { cpu: "25m", memory: "48Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: invoiceiq
spec:
  selector: { app: invoiceiq, component: frontend }
  ports:
    - { name: http, port: 80, targetPort: 80 }
