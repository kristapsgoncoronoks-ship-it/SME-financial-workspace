# Worker LANES — resource isolation for the heavy modules (opt-in).
#
# Apply this INSTEAD of 35-worker.yaml when you want the CPU-heavy OCR/extraction
# work on its own pool so it can never starve — or be starved by — the light,
# latency-sensitive periodic jobs (dunning, recurring invoices, integrity).
#
# The two lanes are complementary: worker-extract takes email.extract and
# upload.extract; worker-general takes every other kind. Scale and size each
# independently. Receipt scans and some report generation still use the web
# tier; these lanes do not establish aggregate OCR or fleet capacity.
#
#   kubectl -n invoiceiq delete deploy worker            # remove the all-kinds pool
#   kubectl -n invoiceiq apply -f 36-worker-lanes.yaml   # bring up the two lanes
#
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-extract
  namespace: invoiceiq
  labels: { app: invoiceiq, component: worker, lane: extract }
spec:
  replicas: 2                          # scale up during onboarding/ingestion bursts
  selector:
    matchLabels: { app: invoiceiq, component: worker, lane: extract }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: invoiceiq, component: worker, lane: extract }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/OWNER/REPO/backend:VERSION
          command: ["python", "-m", "app.worker", "--kinds", "email.extract,upload.extract"]
          envFrom:
            - configMapRef: { name: invoiceiq-config }
            - secretRef: { name: invoiceiq-secrets }
          # OCR/parse is CPU-bound — give this lane more CPU headroom and schedule
          # it on compute-optimised nodes if available (nodeSelector/affinity).
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "2000m", memory: "1Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          # Same liveness as 35-worker.yaml: the loop's own heartbeat file,
          # probed by the import-light `app.worker_probe`; a wedged loop is
          # restarted, a queue backlog is not (see 35-worker.yaml).
          livenessProbe:
            exec:
              command: ["python", "-m", "app.worker_probe"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 60   # OCR jobs can be long — allow draining
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-general
  namespace: invoiceiq
  labels: { app: invoiceiq, component: worker, lane: general }
spec:
  replicas: 2
  selector:
    matchLabels: { app: invoiceiq, component: worker, lane: general }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: invoiceiq, component: worker, lane: general }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/OWNER/REPO/backend:VERSION
          command: ["python", "-m", "app.worker", "--exclude", "email.extract,upload.extract"]
          envFrom:
            - configMapRef: { name: invoiceiq-config }
            - secretRef: { name: invoiceiq-secrets }
          # Light, steady periodic work — a small footprint is plenty.
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          # Same liveness as 35-worker.yaml: the loop's own heartbeat file,
          # probed by the import-light `app.worker_probe`; a wedged loop is
          # restarted, a queue backlog is not (see 35-worker.yaml).
          livenessProbe:
            exec:
              command: ["python", "-m", "app.worker_probe"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
